; EXAMPLE only. Exact board manifest for WRL-20168 USB-C variant
; must be checked before attempting hardware upload.
; The esp32dev profile is documented by PlatformIO for an
; ESP32dev, but is NOT independently verified on WRL-20168.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 115200